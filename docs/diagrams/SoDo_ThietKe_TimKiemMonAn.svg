<text x="40" y="1837" font-family="Segoe UI, Arial" font-size="20" fill="#263B50">Phạm vi: nhánh món ăn. SearchDishUI5.jsp còn tìm combo; phần ComboDAO/ComboDetailUI5.jsp không vẽ ở đây.</text>
